<!-- The minimal loop as a cycle of six numbered steps, in one inline SVG: the judge, the queue, the editor, the drafted lesson, the rule owner and the gate, with the
two exits of the gate (PASS goes on to the next run, FAIL or HOLD changes nothing) and the Paused switch drawn as a dashed frame around everything.
Colours come only from the role tokens (ink, ink-muted, accent, border, border-control, surface-raised, surface-sunken), so it follows the light and dark themes. No ids inside.
Put it inside figure.geo-figure > div.geo-figure-frame and give the figure a caption in plain words, for example: "The loop in six steps. People decide in steps 3 and 5; the agent does the rest; nothing changes a rule unless the gate passes."
Used on the Summary and on Minimal and optimal. The legend is inside the SVG. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" role="img" aria-label="The minimal loop as a cycle of six steps. Step 1: the judge reads the claims against the written rulebook, tag by tag. Step 2: unsure tags go to the queue, the Tag decisions table in Notion. Step 3: the editor decides each row, filling in Tag outcome, Why wrong and Your reasoning. Step 4: a lesson is drafted, only when decisions blame a rule, and saved in Rule changes. Step 5: the rule owner approves the lesson or rejects it. Step 6: the gate tests the lesson against every earlier decision; on a PASS the rulebook is updated, follow-up re-checks the claims and the next run uses the new rule, and on a FAIL or HOLD nothing changes and the rule owner can reword the lesson and try again. People decide in steps 3 and 5; the agent does the rest. The Paused switch stops every step." style="min-width:760px;font-family:var(--font-sans)">
