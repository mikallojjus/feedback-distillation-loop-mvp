<!-- The plan in stages, as one inline SVG: six columns (Stage 0, the code changes after the go-ahead, Stages 1 to 3, and Later in dashed outline) and four lanes (you as the product owner, the engineer, the editor, the machine),
with cards where each acts, an effort chip S, M or L on the engineer's cards and a "Done when" line under each column. Stages are places in a sequence, with no dates or durations.
The effort letters are the author's assignment and are not taken from another document. Colours come only from the role tokens (ink, ink-muted, accent, border-control, surface-sunken), so it follows the light and dark themes. No ids inside.
Put it inside figure.geo-figure > div.geo-figure-frame and give the figure a caption in plain words, for example: "The plan in stages: each column is a stage, each row a person or the machine, and S, M and L show the engineer's effort." Used on Path to editors. The legend is inside the SVG. -->
