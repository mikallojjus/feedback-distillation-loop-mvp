<!-- What the optimal version adds, in one inline SVG: the same six-step cycle as loop-cycle-figure.html drawn in muted outlines, and the seven additions as accent-tinted boxes with a dashed outline,
each with a "later" chip and a one-line trigger, joined by a dashed leader to the step where it applies (three at step 1, one at step 3, one at step 6, one on the PASS exit) and the scheduled runs as a tinted ring around the loop.
Colours come only from the role tokens (ink, ink-muted, accent, accent-tint, border-control, surface-raised, surface-sunken), so it follows the light and dark themes. No ids inside.
Put it inside figure.geo-figure > div.geo-figure-frame and give the figure a caption in plain words, for example: "What the optimal version adds on top of the minimal loop; nothing in the loop itself changes."
Used on Minimal and optimal. The legend is inside the SVG. -->
