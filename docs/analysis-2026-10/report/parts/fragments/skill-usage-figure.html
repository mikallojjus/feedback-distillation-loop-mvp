<!-- How the editor uses the skill in the real loop, as one inline SVG with two lanes: "The editor, in Notion" on top (accent outlines: a person decides) and "The editor, in Claude Code" below (ink outlines: the agent does the work),
six numbered steps in a staircase (status, tag, decide rows, distill, approve or reject, promote) with a loop arrow from promote back to tag, and the Paused tick drawn apart with a dashed outline.
Colours come only from the role tokens (ink, ink-muted, accent, border, surface-raised, surface-sunken), so it follows the light and dark themes. No ids inside.
Put it inside figure.geo-figure > div.geo-figure-frame and give the figure a caption in plain words, for example: "Four commands and two Notion actions; everything else the agent does by itself."
Used on Minimal and optimal. The legend is inside the SVG. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" role="img" aria-label="How the editor uses the skill in the real loop, in two lanes: in Claude Code the editor types commands, and in Notion the editor decides. Step 1: in Claude Code, type /claim-tagger status to see what is waiting. Step 2: type /claim-tagger tag; the agent reads new claims and unsure tags land in the queue. Step 3: in Notion, decide the rows in Your queue by filling in Tag outcome, Why wrong and Your reasoning. Step 4: type /claim-tagger distill; a rule change is drafted from decisions that blame a rule. Step 5: in Notion, approve or reject the draft in Lessons waiting, or rewrite it in Editor wording. Step 6: type /claim-tagger promote; the gate tests the rule, and on a PASS the rule goes live and follow-up runs by itself. An arrow labelled next run leads from step 6 back to step 2. Drawn apart from the loop, ticking Paused in Agent settings in Notion stops every command at once." style="min-width:760px;font-family:var(--font-sans)">
