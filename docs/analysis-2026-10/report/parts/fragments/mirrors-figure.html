<!-- One rulebook over many claims tables, as one inline SVG: the U.S. Politics claims table and, dashed, World affairs at the top corners, the rulebook between them, the judge that sees only the claim text and the rules,
the one shared answer per claim text that goes back to each claims table as two text columns, and the queue below it with the open check beside it.
Colours come only from the role tokens (ink, ink-muted, accent, surface-raised), so it follows the light and dark themes. No ids inside.
Put it inside figure.geo-figure > div.geo-figure-frame and give the figure a caption in plain words, for example: "A claim that appears in two tables is judged once and written to both."
Used on Your questions, One table or many. The legend is inside the SVG. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="100%" role="img" aria-label="One rulebook, many claims tables. At the top left, the U.S. Politics debate claims table with {{count:scale.usClaims}} claims; at the top right, drawn dashed, World affairs, which comes later; in the middle, the rulebook with {{count:tags.issue}} tags. Claim text flows from both claims tables into the judge, and the rules flow from the rulebook into the judge, which sees only the claim text and the rules. The judge keeps one shared answer per claim text. That answer goes back to each claims table as two text columns, Agent tags and Agent notes, so a claim that appears in two tables is judged once and written to both. Below the shared answer, the queue holds one row per Geo ID and tag, where a person decides. A dashed note beside the queue records an open check: can one Geo ID be in both tables?" style="min-width:760px;font-family:var(--font-sans)">
