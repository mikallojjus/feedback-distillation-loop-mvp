<!-- Which tags go where, as one inline SVG in three columns: the thirteen tags as pills in five clusters (solid pill = ready now, dashed pill = after the drafted rules are approved or later),
the five lanes that judge them (the first and second cache groups of the text pass, code, the source pass and the search that is not built yet, each with the event that makes it re-judge),
and what happens when the judge is unsure. Colours come only from the role tokens (ink, ink-muted, accent, surface-raised, surface-sunken), so it follows the light and dark themes. No ids inside.
Put it inside figure.geo-figure > div.geo-figure-frame and give the figure a caption in plain words, for example: "Which tags go where: each tag is judged in one lane, and each lane decides what happens when the agent is unsure. Solid pills are ready now; dashed pills wait for approved rules or for later work." Used on Your questions, Human judgement and Per-tag judging. The legend is inside the SVG. -->
