<!-- The seven steps of the walkthrough as one inline SVG: two lanes (you, the editor, in Notion on top, the agent in Claude Code below), seven numbered steps in a staircase with the practice-page command on each agent step,
the safety check drawn as a diamond with a PASS exit to step 7 and a dashed FAIL branch (reword the rule in Editor wording and run promote again; a second FAIL sets Rejected and the rule stays),
one outcome line inside each box, and a strip that says nothing real changes. No durations anywhere.
Colours come only from the role tokens (ink, ink-muted, accent, border, surface-raised, surface-sunken), so it follows the light and dark themes. No ids inside.
Put it inside figure.geo-figure > div.geo-figure-frame and give the figure a caption in plain words, for example: "The seven steps of the walkthrough, on a practice page: you decide in Notion, the agent works in Claude Code, and nothing real changes." In this figure "you" is the editor. Used on Path to editors. The legend is inside the SVG. -->
