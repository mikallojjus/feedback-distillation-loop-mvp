<!-- The Notion map as one inline SVG: on the left the real tables shared with the team (the U.S. Politics claims table where the agent writes two text columns, and three protected tables),
on the right, inside a dashed frame for the new Notion page, the agent's four tables (Tag decisions, Rule changes, Agent settings, Rulebook copy), below it the rulebook file in the repository,
the two arrows that matter (unsure tags to the queue, the taxonomy copied once into the Rulebook copy) and a legend for the box outlines.
Colours come only from the role tokens (ink, ink-muted, accent, border, surface-raised, surface-sunken), so it follows the light and dark themes. No ids inside.
Put it inside figure.geo-figure > div.geo-figure-frame and give the figure a caption in plain words, for example: "Which Notion tables exist and who writes what: the agent writes two text columns on the real claims table and its own four tables, and nothing else."
Used on Minimal and optimal. Counts are filled from data/counts.json. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="100%" role="img" aria-label="A map of the Notion tables and who writes what. On the left, four real tables shared with the team: U.S. Politics debate claims, with {{count:scale.usClaims}} claims, where the agent writes only two text columns; World affairs, protected until it is added; Claims to review, protected; and Claim Tags, verified, the taxonomy, protected and never written. On the right, on a new Notion page, the agent's four tables: Tag decisions, the queue with {{count:notion.minimalQueueColumns}} columns, where the editor decides; Rule changes, where the editor approves; Agent settings, where the Paused switch stops every command; and the Rulebook copy, where the agent writes When to use only after a PASS. Unsure tags go from the claims table to Tag decisions. The {{count:tags.issue}} Issue rows are copied once from the taxonomy to the Rulebook copy. The rulebook file in the repository, outside Notion, is compared with the Rulebook copy before every step, to catch drift. The old hub and the sandbox stay as read-only history." style="min-width:760px;font-family:var(--font-sans)">
