  "text": {
    "Context-dependent": "1. A pronoun with no antecedent inside the claim (\"He said ...\", \"its predecessor\", \"they announced\") makes the claim Context-dependent.\n2. A definite reference that needs an outside antecedent to identify it (\"the vulnerabilities\", \"the discussions\", \"the recording\", \"the settlement terms\", \"the legal dispute\", \"recent actions\", or a bare \"the ruling\" or \"the state\" that the claim does not specify) makes the claim Context-dependent, even when other entities in the claim are named; a bare reference to a particular event, decision or place is not a generic. The proper name of one specific institution, agency or court (a central bank, a commission) identifies itself and does not count. A bare 'the government' or 'the state' used generically for whoever governs, as in a general policy recommendation, is not an outside antecedent and does not count.\n3. A descriptive definite that names a kind of thing but not which one (\"the Bitcoin ETF\", \"the major-bank stablecoin consortium\", \"the open-access version\", \"the infrastructure\", \"the new model\") makes the claim Context-dependent: the reader must already know which ETF, consortium, version or product is meant. A description that works as the name of one specific program, law or rule, so that only one thing fits it, already says which one and does not count; a description that more than one thing could fit (more than one campaign, more than one convention in the same city) still counts. Applies to countable things, not to abstract or mass nouns (\"the regulatory clearance\", \"the market\").\n4. Test: could a reader who sees only this sentence say which specific thing each definite reference points at? If any answer is no, tag Context-dependent.\n5. Do not use for indefinites, time expressions, generics, or definites the claim itself resolves.",
    "Exact duplicate": "1. Use when a different claim entity with the same claim text is verified in at least one canonical Geo space.\n2. Compare the text exactly, ignoring only leading, trailing or repeated whitespace. Differences in wording, capitalization, punctuation or numbers are not exact matches under this rule.\n3. The same Geo entity appearing in multiple spaces is not a duplicate. The matching claim must have a different Geo ID; ignore the claim being checked itself.\n4. Identify the matching claim by its Geo ID or URL and canonical space. If lookup is unavailable or inconclusive, report Can’t tell rather than asserting a duplicate or a clean result.",
    "Factually challenged": "Requires reading the source and, ideally, the wider record (source-reading tag); coverage-limited.\n1. Fires when evidence contradicts or materially disputes the claim's assertion.\n2. Does not fire merely because a source fails to support the claim (that is Improperly sourced).\n3. NOT-CHECKABLE where no source is attached or the host blocks fetching.\n4. STILL PROPOSED: on the 10 Sep fresh sample this tag fired on zero factual claims (curated claims are rarely contradicted by their own sources), so the definition is not yet exercised on a real positive case. Keep; validate on a claim that is genuinely contradicted before marking Verified.",
    "Improper capitalization": "1. Use when the first word is lowercase where normal sentence casing requires a capital.\n2. Use when ordinary words are capitalized mid-sentence without a grammatical or naming reason, including title-style capitalization or all-caps emphasis.\n3. Use when a proper name is miscapitalized, such as “microsoft” instead of “Microsoft”.\n4. Preserve established capitalization in names, acronyms and technical notation, such as “iPhone”, “NASA” and “pH”. Apply the tag only when the capitalization is clearly incorrect.",
    "Improperly sourced": "Requires reading the source (source-reading tag), so it is coverage-limited, not a text-only judgment.\n1. Fires when the source is fetched and read and does not carry the claim's specific assertion (\"the price points the claim cites are not in the article\", \"the country coverage the claim states is not mentioned\").\n2. Does not fire when the source supports the claim's core assertion even if a minor secondary detail is unstated (treat that as supported).\n3. No attached source is Unsourced. An attached source that cannot be read is . Access failure alone never justifies Improperly sourced, Factually challenged, Unverified, or a contradiction verdict; never report unread content as a pass.\n4. Applies to factual claims; an opinion has no supporting source in the ordinary sense.\n5. Validated 10 Sep on a source-reading pass over the fresh sample: 71% of sourced claims were checkable; the tag fired correctly on every checkable mismatch.",
    "Incorrect grammar": "1. Use when the claim contains a clear grammatical error, such as incorrect subject–verb agreement, an incorrect verb form, or a missing word required for a grammatical sentence.\n2. Use when punctuation is incorrect, such as a comma joining two independent sentences without a conjunction, a misused apostrophe, or unmatched quotation marks or brackets.\n3. A missing final period or multiple grammatically correct sentences does not trigger this tag; those formatting conventions are assessed separately.\n4. Apply only for a specific grammatical or punctuation defect. Accepted English variants, stylistic preferences and awkward wording alone do not qualify.",
    "Multi-sentence": "1. Use when the claim text contains two or more separate sentences.\n2. Count actual sentence boundaries. Periods within abbreviations, initials, decimal numbers or URLs do not create additional sentences.\n3. A single sentence with several clauses, a colon or a semicolon does not trigger this tag. A final period alone also does not trigger it.",
    "Poor wording": "1. Use when confusing word choices, awkward sentence construction or unclear connections between ideas make the claim difficult to understand.\n2. Use when the wording permits materially different interpretations and the intended assertion cannot be identified clearly.\n3. Identify the wording that causes difficulty. Suggest a clearer rewrite only when the intended meaning is evident; otherwise explain the ambiguity rather than guessing.\n4. Technical language, length or an unfamiliar subject alone does not trigger this tag. If the only issue is missing outside context, use Context-dependent; if the meaning is clear but unnecessarily lengthy, use Wordy. Apply multiple tags only when each issue is independently present.",
    "Semantically duplicated": "1. Use when another claim entity in a canonical Geo space expresses the same assertion despite different wording.\n2. The claims must preserve the same entities, scope, time period, quantities, polarity, certainty, attribution and material conditions. A difference that changes the assertion prevents a duplicate verdict.\n3. Sharing a topic, supporting or opposing another claim, or making a broader or narrower assertion is not enough. Neither claim should add material information absent from the other.\n4. The matching claim must have a different Geo ID. The same entity appearing in multiple spaces is not a duplicate. For identical text under the Exact duplicate rules, use Exact duplicate instead.\n5. Identify the matching claim by its Geo ID or URL and canonical space, and briefly explain the equivalence. If lookup or comparison is unavailable or inconclusive, report Can’t tell.",
    "Source inaccessible": "1. Use when an attached source cannot be read after reasonable access attempts, such as a blocked host, paywall, login requirement, dead link, or unreadable document.\n2. Identify the inaccessible source and any accessible sources separately; one blocked source does not mean all sources are blocked.\n3. If no source is attached, use Unsourced instead.\n4. Inaccessibility alone does not justify Improperly sourced, Factually challenged, Unverified, or a contradiction verdict. A separate readable source may independently justify another tag.\n5. Remove this access flag when the source becomes readable, then assess its support separately.\nEditorial rule confirmed by Mohammed on 11 October 2026; not an accuracy benchmark.",
    "Trailing period": "1. Use when a single-sentence claim title ends with a full stop used to close the sentence. Ignore trailing whitespace when checking.\n2. Do not flag a period that belongs to an abbreviation, initial or URL rather than serving as sentence-ending punctuation.\n3. This is a formatting flag only. It does not imply that the claim is unclear, ungrammatical or factually incorrect. Assess claims containing multiple sentences under Multi-sentence.",
    "Unsourced": "Deterministic, not a language judgment: read the Claim's Sources relation on Geo, do not read the text.\n1. Fires when the Sources relation is empty.\n2. Does not fire when at least one Source is attached, regardless of whether that source actually supports the claim (that is Improperly sourced).\n3. Nature-agnostic: a claim can be Factual and Unsourced, or Opinion and Unsourced.\n4. Verified 10 Sep on a fresh 100-claim crypto sample: 9/100 unsourced; 91 carried a Source with a resolvable Web URL.",
    "Wordy": "1. Use when unnecessary words, repetition, redundant qualifiers or drawn-out constructions can be removed without changing the claim’s meaning.\n2. Test with a clearly shorter rewrite. Preserve the same entities, quantities, dates, attribution, scope, uncertainty and conditions; shortening must not strengthen or weaken the assertion.\n3. Length alone does not trigger this tag. Do not flag a long claim when its words are needed to state the assertion precisely, and do not apply an arbitrary word-count limit.\n4. If the meaning is difficult to understand, assess Poor wording separately. Apply both tags only when the claim independently has unnecessary wording and a clarity problem."
  },
  "columns": {
    "Context-dependent": {
      "Description": "A claim whose meaning depends on something introduced outside it: a pronoun or a definite reference (\"the initiative\", \"the vulnerabilities\", \"recent actions\") that no name inside the claim resolves, so a reader cannot tell what it points at.",
      "Example Claims": "Open AI's initiative went well with the target group.\nHe said the new model outperforms its predecessor.\nThe company's revenue grew 40% after the launch.\nCore Lightning developers are keeping the technical details of the vulnerabilities under embargo for two weeks.\nThe Commodity Futures Trading Commission did not comment specifically on the discussions.\nThe Bitcoin ETF successfully integrated Bitcoin into traditional brokerage accounts.",
      "Counterpart": "Self-contained"
    },
    "Exact duplicate": {
      "Description": "Exactly the same claim already exists in one of the canonical spaces",
      "Example Claims": "",
      "Counterpart": ""
    },
    "Factually challenged": {
      "Description": "A claim that is contradicted or disputed by the evidence — its own attached source, or another source in the space, asserts the opposite of or materially undercuts the claim. Distinct from Improperly sourced (source simply does not cover the claim) — here the evidence actively pushes against it.",
      "Example Claims": "",
      "Counterpart": ""
    },
    "Improper capitalization": {
      "Description": "A claim whose text breaks sentence casing: mid-sentence capitals on words that are not proper nouns, proper nouns left lowercase, or all-caps emphasis.",
      "Example Claims": "peace Is Better than War.\nThe Company Announced Record Profits In The Third Quarter.\nbitcoin's supply is CAPPED at 21 million coins.",
      "Counterpart": ""
    },
    "Improperly sourced": {
      "Description": "A claim whose attached source, when read, does not actually support the claim's assertion — the source is present but the specific figure, event, or statement the claim makes is absent from or not established by it. Distinct from Unsourced, where no source is attached at all.",
      "Example Claims": "",
      "Counterpart": ""
    },
    "Incorrect grammar": {
      "Description": "Does not follow proper punctuation and grammar.",
      "Example Claims": "",
      "Counterpart": ""
    },
