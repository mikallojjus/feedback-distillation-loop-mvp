    },
    "Source inaccessible": {
      "Description": "One or more attached sources cannot be accessed for review, so their contents cannot be assessed. This records an access problem without judging the claim’s truth, support, or contradiction.",
      "Example Claims": "Access-limited examples from the audit, without a support verdict:\n— attached source content could not be read.\n— attached source content could not be read.\n— one attached source remained unread; another was accessible.",
      "Counterpart": ""
